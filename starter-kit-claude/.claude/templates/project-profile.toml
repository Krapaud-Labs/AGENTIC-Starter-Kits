schema_version = 1
project_name = "à compléter"
project_type = "unknown"
risk_tolerance = "standard"
# autonomous-after-brief ou approval-per-step
execution_mode = "autonomous-after-brief"
# continuous-until-done ou step-by-step
execution_authorization = "continuous-until-done"
integration_branch = "develop"

[stack]
languages = []
package_manager = ""
runtime = ""

[stack.frontend]
enabled = false
framework = ""
ui_library = ""
test_framework = ""

[stack.backend]
enabled = false
framework = ""
api_style = ""
test_framework = ""

[stack.database]
enabled = false
engine = ""
orm_or_query_layer = ""
migrations = ""

[stack.infrastructure]
containerization = ""
deployment = ""
ci_provider = ""

[stack.security]
authentication = ""
authorization = ""
secrets_provider = ""

[commands]
install = ""
lint = ""
test = ""
build = ""
security = ""

[capabilities]
frontend = false
backend = false
database = false
authentication = false
deployment = false
ci = false

[agents]
produit = false
qa = true
devops = false
performance = false
ux_research = false
accessibilite = false
data = false
documentation = true
release = false
conformite = false

[tracking]
mode = "local"
provider = ""
trello_choice = "pending"
trello_execution = "always-build"
trello_board_name = ""
trello_workspace = ""
# Format : [{ name = "Prénom Nom", role = "Rôle projet", trello_id = "" }]
trello_members = []
# pending_activation, syncing, verified ou blocked
trello_sync_status = "pending_activation"
trello_board_id = ""
trello_board_url = ""

[delivery]
uses_pull_requests = true
# pull-request-only ou every-push. Le Coordinateur propose ce choix à l'onboarding.
ci_trigger_mode = "pull-request-only"
requires_human_approval_for_critical = true
require_feature_branch = true
max_files_per_commit = 75
max_changed_lines_per_commit = 1200

[updates]
# ask, pr ou off. Le mode pr ouvre une Pull Request automatique.
mode = "pr"
source = "https://github.com/Krapaud-Labs/AGENTIC-Starter-Kits.git"
