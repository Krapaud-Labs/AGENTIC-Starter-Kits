name: Validate starter kits

on:
  pull_request:
    branches: [dev, develop, main]
  push:
    branches: [dev, develop, main]

permissions:
  contents: read

concurrency:
  group: starter-kits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate imports and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Validate Markdown
        run: npx --yes markdownlint-cli2 'README.md' 'INSTALLATION.md' 'CONTRIBUTING.md' 'VERSIONING.md' 'SECURITY.md' 'starter-kit-codex/**/*.md' 'starter-kit-claude/**/*.md'

      - name: Validate repository version
        run: bash scripts/check-version.sh

      - name: Validate documentation and version consistency
        run: bash scripts/check-documentation-consistency.sh

      - name: Validate executable governance gates
        run: bash scripts/test-executable-gates.sh

      - name: Run isolated sandbox scenarios
        run: bash scripts/test-sandbox-scenarios.sh

      - name: Run isolated adapter simulations
        run: bash scripts/test-sandbox-adapters.sh

      - name: Require all public READMEs for starter kit changes
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          changed="$(git diff --name-only "$base" HEAD)"
          if printf '%s\n' "$changed" | grep -qE '^(starter-kit-(codex|claude)/|\.codex/|\.claude/|scripts/|README\.md|VERSION|VERSIONING\.md|CHANGELOG\.md)'; then
            for readme in README.md starter-kit-codex/README.md starter-kit-claude/README.md; do
              printf '%s\n' "$changed" | grep -Fxq "$readme" || { echo "README requis dans cette PR: $readme"; exit 1; }
            done
          fi

      - name: Check shell syntax and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find starter-kit-codex starter-kit-claude -type f -name '*.sh' -print0)
          em_dash="$(printf '\342\200\224')"
          marker_left="$(printf '<%.0s' {1..7})"
          marker_mid="$(printf '=%.0s' {1..7})"
          marker_right="$(printf '>%.0s' {1..7})"
          ! rg -n --hidden --glob '!.git/**' -- "$em_dash|$marker_left|$marker_mid|$marker_right" .

      - name: Validate portable imports
        shell: bash
        run: |
          set -euo pipefail
          for kit in codex claude; do
            temp_root="$(mktemp -d)"
            project_root="$temp_root/project"
            config_dir=".$kit"
            [ "$kit" = "codex" ] && config_dir=".codex"
            [ "$kit" = "claude" ] && config_dir=".claude"

            mkdir -p "$project_root"
            git init --quiet "$project_root"
            git -C "$project_root" checkout --quiet -b chore/ci-validation
            cp -R "starter-kit-$kit/$config_dir" "$project_root/$config_dir"
            [ "$kit" = "codex" ] && cp starter-kit-codex/AGENTS.md "$project_root/AGENTS.md"
            [ "$kit" = "claude" ] && cp starter-kit-claude/CLAUDE.md "$project_root/CLAUDE.md"

            bash "$project_root/$config_dir/scripts/lint-kit.sh"
            bash "$project_root/$config_dir/scripts/init-project.sh"

            if bash "$project_root/$config_dir/scripts/preflight.sh"; then
              echo "Le preflight devait bloquer sans cahier des charges accepté."
              exit 1
            fi

            cp "$project_root/$config_dir/templates/project-brief.md" "$project_root/$config_dir/PROJECT-BRIEF.md"
            cp "$project_root/$config_dir/templates/project-profile.toml" "$project_root/$config_dir/project-profile.toml"
            perl -0pi -e 's/## Statut\n\npending/## Statut\n\naccepted/' "$project_root/$config_dir/PROJECT-BRIEF.md"
            perl -0pi -e 's/project_name = "à compléter"/project_name = "ci-validation"/' "$project_root/$config_dir/project-profile.toml"
            perl -0pi -e 's/project_type = "unknown"/project_type = "service"/' "$project_root/$config_dir/project-profile.toml"
            sed -i "s/trello_choice = \"pending\"/trello_choice = \"disabled\"/" "$project_root/$config_dir/project-profile.toml"
            bash "$project_root/$config_dir/scripts/initialize-project-design.sh"
            find "$project_root/docs" -type f -name '*.md' -exec sed -i 's/\[\[A_COMPLETER[^]]*\]\]/Conception validée par le scénario CI/g' {} +
            sed -i 's/^Status: draft$/Status: approved/; s/^- \[ \]/- [x]/g' "$project_root/docs/design/design-readiness.md"

            bash "$project_root/$config_dir/scripts/preflight.sh"
            bash "$project_root/$config_dir/scripts/verify-before-push.sh"
          done

  validate-windows-wrapper:
    name: Validate PowerShell wrappers
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Parse PowerShell wrappers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path starter-kit-codex, starter-kit-claude -Recurse -Filter run.ps1 |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                throw "Syntaxe PowerShell invalide dans $($_.FullName): $($errors.Extent.Text -join ', ')"
              }
            }
