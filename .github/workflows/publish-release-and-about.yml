name: Publish release and repository about

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version SemVer à publier, ou vide pour lire VERSION"
        required: false
        type: string

  push:
    branches:
      - main
    paths:
      - VERSION
      - CHANGELOG.md
      - VERSION-HISTORY.md
      - .github/workflows/publish-release-and-about.yml

permissions:
  contents: write
  discussions: write

jobs:
  publish:
    name: Publish release metadata
    runs-on: ubuntu-latest
    env:
      HAS_REPO_SETTINGS_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN != '' }}
    steps:
      - name: Checkout tagged version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          requested="${{ inputs.version }}"
          if [ -n "$requested" ]; then
            test "$requested" = "$version"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag déjà présente : $RELEASE_TAG"
          else
            git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release déjà présente : $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Agentic Starter Kits $RELEASE_TAG" --generate-notes --verify-tag
          fi

      - name: Update repository description
        if: env.HAS_REPO_SETTINGS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN || github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" \
            --field description='Starter kits premium et portables pour orchestrer des projets logiciels avec Codex ou Claude, avec gouvernance, sécurité, GitFlow, CI et mises à jour contrôlées.'

      - name: Update repository topics
        if: env.HAS_REPO_SETTINGS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN || github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/topics" \
            --header 'Accept: application/vnd.github+json' \
            --input - <<'JSON'
          {"names":["ai-agents","agentic-workflows","codex","claude-code","developer-tools","software-architecture","gitflow","github-actions","security","starter-kit"]}
          JSON
