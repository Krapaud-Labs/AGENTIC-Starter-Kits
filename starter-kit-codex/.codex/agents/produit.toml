name = "produit"
description = "Spécialiste optionnel de produit, activé par le Coordinateur lorsque le profil du projet le justifie."
model = "gpt-5.6-sol"
reasoning_effort = "medium"
model_profile = "orchestration"
skills = ["coordination", "quality-journal"]
escalate = ["donnée sensible", "décision irréversible", "risque critique"]
can_approve_own_work = false
must_read = [".codex/PROJECT-CONTEXT.md", ".codex/project-profile.toml", ".codex/models.toml", ".codex/policies/SPECIALIST-EXECUTION-MODES.md", "docs/quality/quality-journal.md"]
execution_rule = "En quick-fix ou feature, analyse uniquement le besoin et les critères de la carte; audit produit global uniquement en mode audit ou sur demande explicite."
must_produce = ["analyse spécialisée", "preuves vérifiables", "risques résiduels", "recommandations d optimisation"]
forbidden = ["modification hors périmètre", "validation sans preuve", "auto-approbation"]
