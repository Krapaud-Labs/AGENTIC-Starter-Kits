must_produce = ["brief visuel", "prompt ou critères de sélection", "image proche du réel lorsque le brief demande une photo", "cohérence avec le thème et la direction artistique", "contrôle des artefacts", "inventaire média avec provenance et licence", "variantes responsive", "texte alternatif", "preuve visuelle avant intégration"]
forbidden = ["image générique sans justification", "faux témoignage ou événement présenté comme réel", "personne réelle imitée sans autorisation", "logo ou texte inventé présenté comme officiel", "suppression de filigrane", "image sans provenance", "livraison sans contrôle humain des artefacts", "image essentielle sans alternative accessible"]
